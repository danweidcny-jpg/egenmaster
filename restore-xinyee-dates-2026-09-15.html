<!doctype html><meta charset="utf-8"><title>Restore Xinyee Dates</title><pre id="out">RUNNING...</pre><script>
const API='https://egen-master-deck-api.danwei.workers.dev/api/storage', KEY='brief-bar-tasks-data', out=document.getElementById('out');
async function getData(){const r=await fetch(API+'?key='+encodeURIComponent(KEY),{cache:'no-store'});if(!r.ok)throw new Error('GET '+r.status);const j=await r.json();return j.value?JSON.parse(j.value):{};}
async function putData(d){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:KEY,value:JSON.stringify(d)})});if(!r.ok)throw new Error('POST '+r.status);}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
(async()=>{try{
 const d=await getData(), ps=d.projects||[];
 const byTitle=(needle)=>ps.find(p=>p.ownerId==='m2'&&norm(p.title).includes(norm(needle)));
 const task=(p,needle)=>p&&(p.tasks||[]).find(t=>norm(t.text).includes(norm(needle)));
 let p=byTitle('PRO3C'); if(p){p.dueDate='2026-10-15'; const t=task(p,'PRO3C Grand Opening'); if(t)t.dueDate='2026-10-15';}
 p=byTitle('Impian Night Run'); if(p){let t=task(p,'Cut off shirt quantity'); if(t)t.dueDate='2026-09-15'; t=task(p,'Pass Impian Run bunting'); if(t)t.dueDate='2026-09-15';}
 p=byTitle('WASB Annual Dinner'); if(p){p.dueDate='2026-09-15'; const t=task(p,'WASB Annual Dinner proposal'); if(t)t.dueDate='2026-09-15';}
 p=byTitle('Tianje Booth Dismantle'); if(p){p.dueDate='2026-09-24'; const t=task(p,'Tianje booth dismantle'); if(t)t.dueDate='2026-09-24';}
 await putData(d);
 const v=await getData(); const xp=(v.projects||[]).filter(p=>p.ownerId==='m2');
 const lines=['SUCCESS']; for(const q of xp){lines.push(q.title+' | project due '+(q.dueDate||'—'));for(const t of (q.tasks||[])){if(t.dueDate)lines.push('  '+t.text+' | '+t.dueDate);}}
 out.textContent=lines.join('\n');
}catch(e){out.textContent='FAILED\n'+e.stack;}})();
</script>
