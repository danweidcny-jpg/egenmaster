<!doctype html><meta charset="utf-8"><title>EGEN JB Schedule Import</title><pre id="out">RUNNING...</pre><script>
const API='https://egen-master-deck-api.danwei.workers.dev/api/storage';
const KEY='brief-bar-tasks-data';
const out=document.getElementById('out');
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
async function getData(){const r=await fetch(API+'?key='+encodeURIComponent(KEY),{cache:'no-store'});if(!r.ok)throw new Error('GET '+r.status);const j=await r.json();return j.value?JSON.parse(j.value):{projects:[],statuses:{},schedules:[],scheduleCounter:1};}
async function putData(d){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:KEY,value:JSON.stringify(d)})});if(!r.ok)throw new Error('POST '+r.status);}
(async()=>{try{
 const d=await getData();d.schedules=d.schedules||[];
 let max=0;for(const s of d.schedules){const m=String(s.id||'').match(/^s(\d+)$/);if(m)max=Math.max(max,+m[1]);}
 let c=Math.max(d.scheduleCounter||1,max+1);
 function ensure(owner,title,date,endDate='',time='',note='Schedule'){
   let s=d.schedules.find(x=>x.ownerId===owner&&norm(x.title)===norm(title)&&x.date===date);
   if(!s){s={id:'s'+(c++),ownerId:owner,title,date,endDate:endDate||date,time,note};d.schedules.push(s);}
   else Object.assign(s,{title,date,endDate:endDate||date,time,note});
 }
 // Xinyee: the 15/09 bunting is already a dated task, so don't duplicate it.
 ensure('m2','Impian Run Roadshow','2026-09-19','2026-09-20','','Confirmed schedule');
 // Tianje 24/09 and PRO3C 15/10 are already represented as project/task dates in calendar.
 // Eunice: Temokin is a two-day confirmed event.
 ensure('m3','Temokin VP Event','2026-10-10','2026-10-11','','Confirmed event');
 // Xiang Ting's I-Stays XX/10 stays pending with no invented date.
 d.scheduleCounter=c;
 await putData(d);
 const v=await getData();
 const x=v.schedules.filter(s=>s.ownerId==='m2');const e=v.schedules.filter(s=>s.ownerId==='m3');
 out.textContent='SUCCESS\nXinyee schedules: '+x.map(s=>s.date+(s.endDate!==s.date?'→'+s.endDate:'')+' '+s.title).join(' | ')+'\nEunice schedules: '+e.map(s=>s.date+(s.endDate!==s.date?'→'+s.endDate:'')+' '+s.title).join(' | ');
}catch(err){out.textContent='FAILED\n'+err.stack;}})();
</script>
