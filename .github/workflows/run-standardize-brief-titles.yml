name: Run New Brief title standardization

on:
  push:
    paths:
      - '.github/workflows/run-standardize-brief-titles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Standardize New Brief titles
        run: python scripts/standardize_brief_titles.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html egen-master-deck.html
          git commit -m "Standardize New Brief titles"
          git push origin main
