name: Reconstruct uploaded HTML

on:
  push:
    branches: [main]
    paths:
      - '.upload/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct HTML
        shell: bash
        run: |
          cat .upload/egen-master-deck.html.gz.b64.part* | base64 --decode | gzip --decompress > egen-master-deck.html
          echo "a1a53226f1a44e21da42d8e08cad91104764a7ec04cda60ecbbe924978b5efc1  egen-master-deck.html" | sha256sum --check --strict

      - name: Commit reconstructed file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add egen-master-deck.html
          if git diff --cached --quiet; then
            echo "HTML already up to date."
          else
            git commit -m "Add EGEN Master Deck app"
            git push
          fi
