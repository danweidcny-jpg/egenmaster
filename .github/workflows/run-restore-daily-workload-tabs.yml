name: Run restore daily workload tabs

on:
  push:
    paths:
      - '.github/workflows/run-restore-daily-workload-tabs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore daily workload tabs
        run: python scripts/restore_daily_workload_tabs.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html egen-master-deck.html
          git commit -m "Restore personal daily workload tabs"
          git push origin main
