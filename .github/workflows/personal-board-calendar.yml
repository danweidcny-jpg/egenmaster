name: Personal board and calendar

on:
  push:
    paths:
      - '.github/workflows/personal-board-calendar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch personal-only board and schedule calendar
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in [Path('index.html'), Path('egen-master-deck.html')]:
              s = path.read_text()

              # State: schedules live in same shared KV payload, but display is owner-filtered.
              anchor = "let statuses = {}; // memberId -> 'free' | 'busy' | 'capacity'\nlet currentUserId = null; // who is using this device right now"
              repl = "let statuses = {}; // memberId -> 'free' | 'busy' | 'capacity'\nlet schedules = []; // {id,ownerId,title,date,endDate,time,note}\nlet scheduleCounter = 1;\nlet currentUserId = null; // who is using this device right now"
              if anchor not in s: raise SystemExit(f'{path}: state anchor missing')
              s = s.replace(anchor, repl, 1)

              # Calendar copy + hide team/person toggle; calendar is personal to selected device user.
              s = s.replace('<h2 class="page-title">Calendar</h2>', '<h2 class="page-title">My Calendar</h2>', 1)
              s = s.replace("<p class=\"page-sub\">Everyone's deadlines in one place — switch to a personal view to see just one person's plate.</p>", "<p class=\"page-sub\">Your own briefs and confirmed schedule in one place.</p>", 1)
              s = s.replace('<div class="cal-toggle" id="calToggle">', '<div class="cal-toggle" id="calToggle" style="display:none;">', 1)

              # Personal board only.
              old = "const allItems = getAllItemsFlat(); // computed once per render, shared below (was recomputed up to 8x)"
              new = "const allItems = getAllItemsFlat().filter(it=>it.ownerId===currentUserId); // personal board only"
              if old not in s: raise SystemExit(f'{path}: board item anchor missing')
              s = s.replace(old, new, 1)

              # Project progress: only current user.
              old = """function renderProjectProgressSection(){
  const projectsWrap = document.getElementById('sectionProjects');
  if(!projectsWrap) return;
  if(!projects.length){
    projectsWrap.innerHTML = `<div class="empty-state"><h3>No projects yet</h3><p>Add one using the quick-add card above — you can break it into tasks right after.</p></div>`;
    return;
  }
  const sorted = projects.slice().sort((a,b)=>{"""
              new = """function renderProjectProgressSection(){
  const projectsWrap = document.getElementById('sectionProjects');
  if(!projectsWrap) return;
  const mine = projects.filter(p=>p.ownerId===currentUserId);
  if(!mine.length){
    projectsWrap.innerHTML = `<div class="empty-state"><h3>No projects yet</h3><p>Add one using the quick-add card above — you can break it into tasks right after.</p></div>`;
    return;
  }
  const sorted = mine.slice().sort((a,b)=>{"""
              if old not in s: raise SystemExit(f'{path}: project section anchor missing')
              s = s.replace(old, new, 1)

              # Active briefs: only own.
              old = "const active = briefs.filter(b=>b.status !== 'Approved');"
              # first occurrence in renderActiveBriefList; relevantBriefs later is replaced separately
              idx = s.find("function renderActiveBriefList(){")
              if idx < 0: raise SystemExit(f'{path}: active brief function missing')
              pos = s.find(old, idx)
              if pos < 0: raise SystemExit(f'{path}: active brief filter missing')
              s = s[:pos] + "const active = briefs.filter(b=>b.status !== 'Approved' && b.assigneeId===currentUserId);" + s[pos+len(old):]

              # Team cards: statuses only; hide project/brief lists and workload details.
              s = s.replace("<div class=\"member-load\">${memberBriefs.length} brief${memberBriefs.length===1?'':'s'} &middot; ${memberProjects.length} project${memberProjects.length===1?'':'s'}</div>", "<div class=\"member-load\">${m.office} office · workload details private</div>", 1)
              if '.other-project-list,.member-briefs{display:none!important;}' not in s:
                  css_anchor = "  .other-project-list{list-style:none; margin:6px 0 0; padding:0;}"
                  if css_anchor not in s: raise SystemExit(f'{path}: team css anchor missing')
                  s = s.replace(css_anchor, "  .other-project-list,.member-briefs{display:none!important;}\n" + css_anchor, 1)

              # Personal calendar mode.
              s = s.replace("let calMode = 'team'; // 'team' | 'personal'", "let calMode = 'personal'; // personal calendar only", 1)

              # Replace relevantBriefs() with generic personal calendar entries (briefs + schedules).
              pat = re.compile(r"function relevantBriefs\(\)\{.*?\n\}", re.S)
              m = pat.search(s)
              if not m: raise SystemExit(f'{path}: relevantBriefs block missing')
              replacement = r'''function relevantBriefs(){
  return briefs.filter(b=>b.status !== 'Approved' && b.assigneeId === currentUserId);
}
function getPersonalCalendarEntries(){
  const entries = [];
  relevantBriefs().forEach(b=>{
    if(!b.dueDate) return;
    entries.push({ id:b.id, kind:'brief', title:b.title, date:b.dueDate, endDate:b.dueDate, time:'', status:b.status, effortLevel:b.effortLevel });
  });
  schedules.filter(x=>x.ownerId===currentUserId).forEach(x=>{
    if(!x.date) return;
    entries.push({ id:x.id, kind:'schedule', title:x.title, date:x.date, endDate:x.endDate||x.date, time:x.time||'', note:x.note||'' });
  });
  return entries;
}
function calendarDates(start, end){
  const out=[];
  let d=new Date(start+'T00:00:00');
  const e=new Date((end||start)+'T00:00:00');
  if(isNaN(d)||isNaN(e)) return out;
  for(; d<=e; d.setDate(d.getDate()+1)) out.push(d.toISOString().slice(0,10));
  return out;
}'''
              s = s[:m.start()] + replacement + s[m.end():]

              # Replace renderCalendar + renderAgenda blocks up to BRIEF DETAIL marker.
              start = s.find('function renderCalendar(){')
              end = s.find('/* ---------------------------------------------------------\n   BRIEF DETAIL MODAL', start)
              if start < 0 or end < 0: raise SystemExit(f'{path}: calendar render block missing')
              calendar_block = r'''function renderCalendar(){
  populateCalPersonSelect();
  calPersonId = currentUserId;
  const year = calCursor.getFullYear();
  const month = calCursor.getMonth();
  document.getElementById('calMonthLabel').textContent = calCursor.toLocaleDateString('en-GB',{month:'long', year:'numeric'});

  const relevant = getPersonalCalendarEntries();
  const byDate = {};
  relevant.forEach(item=>{
    calendarDates(item.date, item.endDate).forEach(d=>{
      (byDate[d] = byDate[d] || []).push(item);
    });
  });

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d=>{
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(year, month, 1);
  let startOffset = firstDay.getDay() - 1;
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date().toISOString().slice(0,10);

  for(let i=0;i<startOffset;i++){
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    grid.appendChild(el);
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items = byDate[dateStr] || [];
    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (dateStr===today ? ' today' : '') + (items.length ? ' has-items' : '');
    cell.innerHTML = `<div class="cal-daynum">${d}</div>` + items.map(it=>`<div class="cal-item" title="${escapeHtml(it.title)}">${escapeHtml((it.time?it.time+' · ':'') + it.title)}</div>`).join('');
    grid.appendChild(cell);
  }

  renderAgenda(relevant);
}

function renderAgenda(relevant){
  const wrap = document.getElementById('calAgenda');
  const sorted = relevant.slice().sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  if(!sorted.length){
    wrap.innerHTML = `<div class="empty-state"><h3>Nothing scheduled</h3><p>No active brief deadlines or confirmed schedule entries yet.</p></div>`;
    return;
  }
  wrap.innerHTML = sorted.map(it=>{
    let meta = '';
    if(it.kind==='brief'){
      const em = EFFORT_META[it.effortLevel] || EFFORT_META.boleh;
      meta = `${em.emoji} ${em.label} · ${it.status}`;
    }else{
      const range = it.endDate && it.endDate!==it.date ? ` → ${formatDate(it.endDate)}` : '';
      meta = `${it.time ? it.time + ' · ' : ''}Schedule${range}${it.note ? ' · '+escapeHtml(it.note) : ''}`;
    }
    return `<div class="agenda-row ${it.kind==='brief'?'clickable':''}" ${it.kind==='brief'?`data-brief="${it.id}"`:''}>
      <div class="agenda-date">${formatDate(it.date)}</div>
      <div class="agenda-info">
        <h4>${escapeHtml(it.title)}</h4>
        <div class="meta">${meta}</div>
      </div>
    </div>`;
  }).join('');
  wrap.querySelectorAll('.agenda-row.clickable').forEach(row=>{
    row.addEventListener('click', ()=> openBriefModal(row.dataset.brief));
  });
}

'''
              s = s[:start] + calendar_block + s[end:]

              # Save/load schedules in shared KV payload.
              old = "const payload = JSON.stringify({ projects, projectCounter, taskCounter, statuses });"
              new = "const payload = JSON.stringify({ projects, projectCounter, taskCounter, statuses, schedules, scheduleCounter });"
              if old not in s: raise SystemExit(f'{path}: save payload anchor missing')
              s = s.replace(old, new, 1)
              old = "statuses = parsed.statuses || {};"
              new = "statuses = parsed.statuses || {};\n      schedules = parsed.schedules || [];\n      scheduleCounter = parsed.scheduleCounter || 1;"
              if old not in s: raise SystemExit(f'{path}: load payload anchor missing')
              s = s.replace(old, new, 1)

              path.write_text(s)
              print('patched', path)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html egen-master-deck.html
          git commit -m "Make board personal and add personal schedule calendar"
          git push origin main
