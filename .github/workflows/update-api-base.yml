name: Update frontend API base

on:
  push:
    paths:
      - '.github/workflows/update-api-base.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace API base in frontend files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = "https://egen-master-deck-api.danwei.workers.dev"
          files = [Path("egen-master-deck.html"), Path("index.html")]
          total = 0
          for path in files:
              text = path.read_text()
              new_text, count = re.subn(
                  r"const API_BASE = 'https://[^']+';",
                  f"const API_BASE = '{target}';",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Expected exactly one API_BASE in {path}, found {count}")
              path.write_text(new_text)
              total += count
          print(f"Updated {total} API_BASE declarations")
          PY
      - name: Commit frontend API URL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add egen-master-deck.html index.html
          git commit -m "Point frontend to deployed Worker"
          git push origin main
