name: Run leadership master view patch

on:
  push:
    paths:
      - '.github/workflows/run-add-master-view.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add master proposal quotation view
        run: python scripts/add_master_view.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html egen-master-deck.html
          git commit -m "Add leadership proposal quotation master view"
          git push origin main
