name: Run team calendar scope

on:
  push:
    paths:
      - '.github/workflows/run-team-calendar-scope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply team calendar scope
        run: python scripts/team_calendar_scope.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html egen-master-deck.html
          git commit -m "Add management team calendar scopes"
          git push origin main
