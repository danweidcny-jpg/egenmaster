name: Cleanup personal dashboard

on:
  push:
    paths:
      - '.github/workflows/cleanup-personal-dashboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Clean personal dashboard and calendar
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files=[Path('index.html'),Path('egen-master-deck.html')]
          calendar=r'''function relevantBriefs(){
  return briefs.filter(b=>b.status !== 'Approved' && b.assigneeId === currentUserId);
}
function calendarDates(start,end){
  const out=[];
  let d=new Date(start+'T00:00:00');
  const e=new Date((end||start)+'T00:00:00');
  if(isNaN(d)||isNaN(e)) return out;
  for(;d<=e;d.setDate(d.getDate()+1)) out.push(d.toISOString().slice(0,10));
  return out;
}
function getPersonalCalendarEntries(){
  const entries=[];
  const mine=projects.filter(p=>p.ownerId===currentUserId);
  const ownSchedules=schedules.filter(x=>x.ownerId===currentUserId);
  const scheduleKeys=new Set(ownSchedules.map(x=>`${x.date}|${String(x.title||'').toLowerCase()}`));

  relevantBriefs().forEach(b=>{
    if(b.dueDate) entries.push({id:b.id,kind:'brief',title:b.title,date:b.dueDate,endDate:b.dueDate,time:'',status:b.status,effortLevel:b.effortLevel});
  });
  mine.forEach(p=>{
    if(p.dueDate && !scheduleKeys.has(`${p.dueDate}|${String(p.title||'').toLowerCase()}`)){
      entries.push({id:'project-'+p.id,kind:'project',title:p.title,date:p.dueDate,endDate:p.dueDate,time:'',note:'Project / event date'});
    }
    (p.tasks||[]).forEach(t=>{
      if(t.dueDate && !t.done) entries.push({id:t.id,kind:'task',title:t.text,date:t.dueDate,endDate:t.dueDate,time:t.time||'',note:p.title+(t.waiting?' · Waiting':'')});
    });
  });
  ownSchedules.forEach(x=>{
    if(x.date) entries.push({id:x.id,kind:'schedule',title:x.title,date:x.date,endDate:x.endDate||x.date,time:x.time||'',note:x.note||'Schedule'});
  });
  return entries;
}

function renderCalendar(){
  populateCalPersonSelect();
  calPersonId=currentUserId;
  const year=calCursor.getFullYear(), month=calCursor.getMonth();
  document.getElementById('calMonthLabel').textContent=calCursor.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const relevant=getPersonalCalendarEntries();
  const byDate={};
  relevant.forEach(item=>calendarDates(item.date,item.endDate).forEach(d=>(byDate[d]=byDate[d]||[]).push(item)));
  const grid=document.getElementById('calGrid');
  grid.innerHTML='';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d=>{const el=document.createElement('div');el.className='cal-dow';el.textContent=d;grid.appendChild(el);});
  const firstDay=new Date(year,month,1); let startOffset=firstDay.getDay()-1; if(startOffset<0) startOffset=6;
  const daysInMonth=new Date(year,month+1,0).getDate(); const today=new Date().toISOString().slice(0,10);
  for(let i=0;i<startOffset;i++){const el=document.createElement('div');el.className='cal-cell empty';grid.appendChild(el);}
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items=(byDate[dateStr]||[]).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
    const cell=document.createElement('div');
    cell.className='cal-cell'+(dateStr===today?' today':'')+(items.length?' has-items':'');
    cell.innerHTML=`<div class="cal-daynum">${d}</div>`+items.map(it=>`<div class="cal-item ${it.kind==='brief'?'clickable':''}" ${it.kind==='brief'?`data-brief="${it.id}"`:''} title="${escapeHtml(it.title)}">${escapeHtml((it.time?it.time+' · ':'')+it.title)}</div>`).join('');
    grid.appendChild(cell);
  }
  grid.querySelectorAll('.cal-item[data-brief]').forEach(el=>el.addEventListener('click',()=>openBriefModal(el.dataset.brief)));
  renderAgenda(relevant);
}
function renderAgenda(relevant){
  const wrap=document.getElementById('calAgenda');
  const sorted=relevant.slice().sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  if(!sorted.length){wrap.innerHTML=`<div class="empty-state"><h3>Nothing scheduled</h3><p>No task deadlines, project dates, proposal deadlines, or confirmed schedule entries yet.</p></div>`;return;}
  wrap.innerHTML=sorted.map(it=>{
    let meta='',icon='📍';
    if(it.kind==='brief'){const em=EFFORT_META[it.effortLevel]||EFFORT_META.boleh;meta=`${em.emoji} ${em.label} · ${it.status}`;icon='📄';}
    else if(it.kind==='task'){meta=escapeHtml(it.note||'Task deadline');icon='☑️';}
    else if(it.kind==='project'){meta=escapeHtml(it.note||'Project / event date');icon='🗂️';}
    else{const range=it.endDate&&it.endDate!==it.date?` → ${formatDate(it.endDate)}`:'';meta=`${it.time?it.time+' · ':''}Schedule${range}${it.note?' · '+escapeHtml(it.note):''}`;}
    return `<div class="agenda-row ${it.kind==='brief'?'clickable':''}" ${it.kind==='brief'?`data-brief="${it.id}"`:''}><div class="agenda-date">${formatDate(it.date)}</div><div class="agenda-info"><h4>${icon} ${escapeHtml(it.title)}</h4><div class="meta">${meta}</div></div></div>`;
  }).join('');
  wrap.querySelectorAll('.agenda-row.clickable').forEach(row=>row.addEventListener('click',()=>openBriefModal(row.dataset.brief)));
}

/* ---------------------------------------------------------
   BRIEF DETAIL MODAL'''

          for path in files:
              text=path.read_text()
              # Remove entire team overview from Board HTML.
              pattern=r'''\n      <div class="eyebrow" style="margin-top:38px;">Team</div>.*?<div id="activeBriefList"></div>\n      </div>'''
              text,n=re.subn(pattern,'',text,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'{path}: team block replace count {n}')

              # Stop Board rendering safely when team grid is absent.
              old="  const grid = document.getElementById('teamGrid');\n  grid.innerHTML = '';"
              new="  const grid = document.getElementById('teamGrid');\n  if(!grid) return;\n  grid.innerHTML = '';"
              if old not in text: raise SystemExit(f'{path}: grid anchor missing')
              text=text.replace(old,new,1)

              # Replace entire old calendar helper/render block, including duplicate functions.
              pattern=r'''function relevantBriefs\(\)\{.*?/\* ---------------------------------------------------------\n   BRIEF DETAIL MODAL'''
              text,n=re.subn(pattern,calendar,text,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'{path}: calendar replace count {n}')

              # Calendar picker should initialize to current user.
              text=text.replace("if(!calPersonId) calPersonId = TEAM[0].id;","if(!calPersonId) calPersonId = currentUserId || TEAM[0].id;",1)

              # Collapse repeated schedule loads to one pair.
              repeated="""      schedules = parsed.schedules || [];
      scheduleCounter = parsed.scheduleCounter || 1;
      schedules = parsed.schedules || [];
      scheduleCounter = parsed.scheduleCounter || 1;
      schedules = parsed.schedules || [];
      scheduleCounter = parsed.scheduleCounter || 1;"""
              once="""      schedules = parsed.schedules || [];
      scheduleCounter = parsed.scheduleCounter || 1;"""
              if repeated in text: text=text.replace(repeated,once,1)

              path.write_text(text)
              print('Cleaned',path)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html egen-master-deck.html
          git commit -m "Finalize personal dashboard and calendar privacy"
          git push origin main
