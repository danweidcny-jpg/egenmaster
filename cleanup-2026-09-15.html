<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>EGEN Cleanup 2026-09-15</title></head><body><pre id="out">Running cleanup…</pre><script>
(async()=>{const out=document.getElementById('out'),API='https://egen-master-deck-api.danwei.workers.dev/api/storage',KEY='brief-bar-tasks-data';const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();try{const r=await fetch(`${API}?key=${encodeURIComponent(KEY)}`,{cache:'no-store'});if(!r.ok)throw new Error('GET '+r.status);const o=await r.json(),d=JSON.parse(o.value),ps=d.projects||[];const p=ps.find(x=>x.ownerId==='m2'&&norm(x.title).includes('impian night run'));if(!p)throw new Error('Xinyee Impian Night Run not found');const before=p.tasks.length;p.tasks=p.tasks.filter(t=>norm(t.text)!=='impian run roadshow');const install='Install banner at school in November';if(!p.tasks.some(t=>norm(t.text)===norm(install))){let max=0;for(const pr of ps)for(const t of(pr.tasks||[])){const m=String(t.id||'').match(/^t(\d+)$/);if(m)max=Math.max(max,+m[1]);}p.tasks.push({id:'t'+(max+1),text:install,done:false,waiting:false,dueDate:''});}let tmax=0;for(const pr of ps)for(const t of(pr.tasks||[])){const m=String(t.id||'').match(/^t(\d+)$/);if(m)tmax=Math.max(tmax,+m[1]);}d.taskCounter=tmax+1;const w=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:KEY,value:JSON.stringify(d)})});if(!w.ok)throw new Error('POST '+w.status);const vr=await fetch(`${API}?key=${encodeURIComponent(KEY)}`,{cache:'no-store'}),vo=await vr.json(),v=JSON.parse(vo.value),vp=v.projects.find(x=>x.ownerId==='m2'&&norm(x.title).includes('impian night run'));out.textContent='SUCCESS — cleanup completed\nBefore: '+before+' tasks\nAfter: '+vp.tasks.length+' tasks\n'+vp.tasks.map(t=>'[ ] '+t.text+' | due '+(t.dueDate||'—')+(t.waiting?' | WAITING':'')).join('\n');}catch(e){out.textContent='FAILED — '+e.message;console.error(e);}})();
</script></body></html>
